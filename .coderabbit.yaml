reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true

  instructions: |
    모든 리뷰와 설명은 한국어로 작성해주세요.
    코드 수정 제안도 한국어로 작성해주세요.

  path_instructions:
    - path: "**/*.java"
      instructions: |
        - Java 17 이상의 문법 권장사항을 반영해 주세요.
        - Spring Boot의 @Transactional 사용 위치와 Dirty Checking 관련 잠재적 이슈를 확인해 주세요.
        - Controller-Service-Repository 계층 구조를 잘 지키는지 검토해 주세요.
        - JPA N+1 문제, 불필요한 쿼리 등 성능 이슈를 함께 검토해 주세요.