services:

  nginx:
    image: nginx:latest
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt

    depends_on:
      app:           # Blue-Green 적용 시 → app-blue 로 변경
        condition: service_healthy
      # app-blue:   # Blue-Green 적용 시 주석 해제
      #   condition: service_healthy
      grafana:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped

    expose:
      - "9113"

    depends_on:
      - nginx

    command:
      - "-nginx.scrape-uri=http://nginx:8081/nginx_status"

  app:
    #build: .
    image: jsh424/senioron:latest

    expose:
      - "8080"

    env_file:
      - .env

    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      # Docker Hub 이미지가 public이라 서비스 계정 키를 이미지에 넣지 않는다.
      # .env와 동일한 방식: 서버에 파일을 한 번 올려두면 git pull이 건드리지 않고 계속 남아있고,
      # 아래 volumes로 컨테이너 안에 마운트만 한다. file: 접두어는 FirebaseConfig가 해석한다.
      FIREBASE_SERVICE_ACCOUNT_PATH: file:/run/secrets/firebase-adminsdk.json

    volumes:
      - /home/ubuntu/senioron-8c2e1-firebase-adminsdk-fbsvc-ba018605fb.json:/run/secrets/firebase-adminsdk.json:ro

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

