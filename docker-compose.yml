services:

  nginx:
    image: nginx:latest
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt

    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest

    expose:
      - "9113"

    command:
      - "-nginx.scrape-uri=http://nginx/nginx_status"

  app:
    #build: .
    image: jsh424/senioron:latest

    expose:
      - "8080"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"

    expose:
      - "9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      app:
        condition: service_healthy

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped

    expose:
      - "8086"

    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"

    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    networks:
      default:
        aliases:
          - grafana

    expose:
      - "3000"

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    mem_limit: 150m

    environment:
      GF_SERVER_ROOT_URL: https://senioron.site/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards

    depends_on:
      prometheus:
        condition: service_started
      influxdb:
        condition: service_started

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/config.yml

    networks:
      default:
        aliases:
          - loki

    expose:
      - "3100"

    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.8

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped

    expose:
      - "9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    restart: unless-stopped

    privileged: true

    expose:
      - "8080"

    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    restart: unless-stopped

    expose:
      - "9104"

    env_file:
      - .env

    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD}

    command:
      - "--mysqld.address=${DB_HOST}:3306"
      - "--mysqld.username=${DB_USERNAME}"
      - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"

    volumes:
      - ./monitoring/mysqld-exporter:/etc/mysqld-exporter:ro

volumes:
  grafana-data:
  influxdb-data: