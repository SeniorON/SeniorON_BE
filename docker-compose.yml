services:

  nginx:
    image: nginx:latest
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt

    depends_on:
      app:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped

    expose:
      - "3306"

    env_file:
      - .env

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mariadb-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  app:
    #build: .
    image: jsh424/senioron:latest

    expose:
      - "8080"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}

    depends_on:
      mariadb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    restart: unless-stopped

    expose:
      - "9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest

    expose:
      - "3000"

    environment:
      GF_SERVER_ROOT_URL: https://senioron.site/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/config.yml

    ports:
      - "3100:3100"

    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.8

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mariadb-data:
  grafana-data: