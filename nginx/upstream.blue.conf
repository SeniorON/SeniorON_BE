# ==========================================================
#  Blue-Green 배포용 Nginx upstream 템플릿 - Blue 환경
#
#  이 파일은 직접 수정하지 마세요.
#  배포 스크립트가 이 파일을 nginx/conf.d/upstream.conf 로 복사합니다.
#
#  초기 설정 (서버에서 최초 1회 실행):
#    cp ~/SeniorON_BE/nginx/upstream.blue.conf \
#       ~/SeniorON_BE/nginx/conf.d/upstream.conf
# ==========================================================

upstream backend {
    server app-blue:8080;
}
