server {
    listen 80;
    server_name senioron.site www.senioron.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name senioron.site www.senioron.site;

    client_max_body_size 12m;

    ssl_certificate     /etc/letsencrypt/live/senioron.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senioron.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /grafana/ {

        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

# ==========================================================
# TODO: Blue-Green 배포 적용 시 아래 1가지만 수정
#
# ※ include 지시어는 추가하지 않을 것
#    Nginx는 conf.d/*.conf 를 자동으로 전부 로드하므로,
#    upstream.conf 를 conf.d/ 에 두면 자동으로 적용됨.
#    별도로 include 를 추가하면 같은 upstream backend 블록이
#    두 번 로드되어 "duplicate upstream" 오류로 nginx reload 실패함.
#
# 수정 내용: 아래 location / 블록에서 proxy_pass 변경
#    기존: proxy_pass http://app:8080;
#    변경: proxy_pass http://backend;
#
# 배포 스크립트가 upstream.conf 를 자동 교체:
#   - nginx/upstream.blue.conf  →  upstream backend { server app-blue:8080; }
#   - nginx/upstream.green.conf →  upstream backend { server app-green:8080; }
# ==========================================================

    location / {

        proxy_pass http://app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#
# Nginx Exporter 전용 내부 상태 페이지
#
server {
    listen 8081;

    location /nginx_status {
        stub_status;
        access_log off;

        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }
}