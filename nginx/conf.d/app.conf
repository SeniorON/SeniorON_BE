server {
    listen 80;
    server_name senioron.site www.senioron.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name senioron.site www.senioron.site;

    client_max_body_size 12m;

    ssl_certificate     /etc/letsencrypt/live/senioron.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senioron.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /grafana/ {

        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location / {

        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#
# Nginx Exporter 전용 내부 상태 페이지
#
server {
    listen 8081;

    location /nginx_status {
        stub_status;
        access_log off;

        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }
}