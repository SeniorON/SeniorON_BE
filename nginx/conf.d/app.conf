server {
    listen 80;
    server_name senioron.site www.senioron.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name senioron.site www.senioron.site;

    ssl_certificate     /etc/letsencrypt/live/senioron.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senioron.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /grafana/ {

        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

# ==========================================================
# TODO: Blue-Green 배포 적용 시 아래 2가지를 수정
#
# 1. 이 파일 제일 위에 아래 한 줄 추가:
#    include /etc/nginx/conf.d/upstream.conf;
#
#    upstream.conf은 배포 스크립트가 자동 교체:
#      - nginx/upstream.blue.conf  →  upstream backend { server app-blue:8080; }
#      - nginx/upstream.green.conf →  upstream backend { server app-green:8080; }
#
# 2. 아래 location / 블록에서 proxy_pass 변경:
#    기존: proxy_pass http://app:8080;
#    변경: proxy_pass http://backend;
#
# 서버에서 사전 준비 (최초 1회):
#   cp ~/SeniorON_BE/nginx/upstream.blue.conf \
#      ~/SeniorON_BE/nginx/conf.d/upstream.conf
#   docker exec senioron_be-nginx-1 nginx -s reload
# ==========================================================

    location / {

        proxy_pass http://app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#
# Nginx Exporter 전용 내부 상태 페이지
#
server {
    listen 8081;

    location /nginx_status {
        stub_status;
        access_log off;

        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }
}