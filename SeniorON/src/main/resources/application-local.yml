spring:
  datasource:
    url: jdbc:h2:mem:senioron;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

kakao:
  client-id: local-dummy-kakao-client-id
  redirect-uri: http://localhost:8080/api/social-accounts/login/kakao/callback

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: senioron-local-dummy-bucket
