spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:senioron;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

kakao:
  client-id: local-dummy-kakao-client-id
  redirect-uri: http://localhost:8080/api/social-accounts/login/kakao/callback

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: senioron-local-dummy-bucket

firebase:
  service-account-path: senioron-8c2e1-firebase-adminsdk-fbsvc-ba018605fb.json
