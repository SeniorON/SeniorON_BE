spring:
  profiles:
    active: local
  application:
    name: senioron
  config:
    import: optional:classpath:application-secret.yml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

jwt:
  secret: this-is-a-temporary-secret-key-for-senioron-jwt-please-change-later
  access-token-expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: senioron

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
firebase:
  service-account-path: senioron-8c2e1-firebase-adminsdk-fbsvc-ba018605fb.json
