spring:
  profiles:
    active: local
  application:
    name: senioron
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import: optional:classpath:application-secret.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: senioron

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  local:
    api-key: ${KAKAO_LOCAL_API_KEY:}

google:
  safebrowsing:
    api-key: ${GOOGLE_SAFEBROWSING_API_KEY:}

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

companion:
  encryption:
    key: ${COMPANION_ENCRYPTION_KEY:}

  prompt:
    resource: classpath:prompts/companion-system-prompt.txt
    version: v1
    recent-message-limit: 20

ai:
  stt:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_STT_MODEL:gpt-4o-mini-transcribe}
      language: ${OPENAI_STT_LANGUAGE:ko}
      connect-timeout: 3s
      read-timeout: 30s

  llm:
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      version: ${ANTHROPIC_VERSION:2023-06-01}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:512}
      connect-timeout: 3s
      read-timeout: 30s
