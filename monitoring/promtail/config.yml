server:
  http_listen_port: 9080


positions:
  filename: /tmp/positions.yaml


clients:
  - url: http://loki:3100/loki/api/v1/push


scrape_configs:

  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock


    relabel_configs:

      # Loki / Promtail 자체 로그 제외
      # Compose 프로젝트명이 변경되어도 유지
      - source_labels:
          ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'loki|promtail'
        action: drop


      # 컨테이너 이름
      - source_labels:
          ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container


      # 이미지 이름
      - source_labels:
          ['__meta_docker_container_image']
        target_label: image


      # Docker 로그 파일 위치
      - replacement: /var/lib/docker/containers/*/*-json.log
        target_label: __path__


    pipeline_stages:
      - docker: {}