name: Docker Deploy

on:
  workflow_run:
    workflows:
      - Docker Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그 (full SHA)'
        required: true

concurrency:
  group: senioron-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions: {}
    # main 브랜치의 이미지 빌드가 성공한 경우에만 배포한다.
    # (workflow_run.branches 필터는 의도대로 동작하지 않아 job 조건으로 검사)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: SSH Key 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: EC2 Blue-Green 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/id_ed25519 \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          cd ~/SeniorON_BE

          git fetch origin main

          git checkout --detach "$IMAGE_TAG"

          bash scripts/blue-green-deploy.sh

          REMOTE_SCRIPT