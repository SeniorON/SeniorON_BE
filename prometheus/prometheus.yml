global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-blue'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - app-blue:8080
        labels:
          color: blue

  - job_name: 'spring-green'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - app-green:8080
        labels:
          color: green

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: 'mariadb'
    static_configs:
      - targets:
          - mysqld-exporter:9104

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090

  - job_name: 'nginx'
    static_configs:
      - targets:
          - nginx-exporter:9113